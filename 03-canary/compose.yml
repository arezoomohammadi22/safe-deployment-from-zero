# Standalone local canary lab: localhost only, not a production deployment.
# Build the shared image once using: docker build -t safe-demo:canary ../demo-app
services:
  app-v1:
    image: safe-demo:canary
    environment:
      APP_VERSION: v1
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2); assert json.load(r)['status']=='ok'"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  app-v2:
    image: safe-demo:canary
    environment:
      APP_VERSION: v2
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2); assert json.load(r)['status']=='ok'"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${CANARY_PORT:-18082}:8080"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-v1:
        condition: service_healthy
      app-v2:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
