# IMPORTANT: 'envoy' is an example. Change to the installed GatewayClass name.
# Gateway API CRDs and a compatible controller must be installed separately.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: checkout-gateway
  namespace: safe-canary
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
