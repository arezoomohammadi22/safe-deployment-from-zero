apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: checkout-route
  namespace: safe-canary
spec:
  parentRefs:
    - name: checkout-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: checkout-v1
          port: 8000
          weight: 80
        - name: checkout-v2
          port: 8000
          weight: 20
