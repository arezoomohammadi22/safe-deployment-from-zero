    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: checkout
          image: safe-demo:canary
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: v2
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
