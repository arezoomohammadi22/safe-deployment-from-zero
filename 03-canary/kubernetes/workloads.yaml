---
apiVersion: v1
kind: Service
metadata:
  name: checkout-v1
  namespace: safe-canary
spec:
  selector: {app: checkout, version: v1}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-v2
