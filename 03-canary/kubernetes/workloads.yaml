# Local demo image: build and load into Kind, or replace with your own registry image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-v1
  namespace: safe-canary
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout, version: v1}
  template:
    metadata:
      labels: {app: checkout, version: v1}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: checkout
          image: safe-demo:canary
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: v1
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-v2
  namespace: safe-canary
spec:
  replicas: 1
  selector:
