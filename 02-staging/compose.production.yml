# Local production SIMULATION. Only loopback port exposure; not a production template.
services:
  checkout:
    image: ${PRODUCTION_IMAGE:-safe-demo:stable}
    environment:
      APP_VERSION: ${PRODUCTION_VERSION:-v1}
    ports:
      - "127.0.0.1:${PRODUCTION_PORT:-18080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2); assert r.status == 200 and json.load(r)['status']=='ok'"]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    labels:
      org.sananet.lab.environment: "production-simulation"
