# CI/CD Lesson 01 — test real checkout behavior, build Docker image, smoke-test it.
# Requires enabled GitLab Container Registry and a Runner supporting Docker-in-Docker.
# DinD (with TLS disabled here for a learning lab) requires a privileged, trusted Runner.

stages:
  - test
  - build
  - smoke

variables:
  DEMO_IMAGE: "$CI_REGISTRY_IMAGE:ci-$CI_COMMIT_SHA"

checkout_tests:
  stage: test
  image: python:3.12-slim
  script:
    - cd demo-app
    - python -m compileall -q app scripts tests
    - python -m unittest discover -s tests -v

docker_build:
  stage: build
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2375"
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - |
      for n in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then break; fi
        if [ "$n" -eq 30 ]; then echo "Docker daemon unavailable"; exit 1; fi
        sleep 1
      done
    - test -n "$CI_REGISTRY_IMAGE" || (echo "Enable GitLab Container Registry"; exit 1)
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull -t "$DEMO_IMAGE" demo-app
    - docker push "$DEMO_IMAGE"

container_smoke_test:
  stage: smoke
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2375"
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - |
      for n in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then break; fi
        if [ "$n" -eq 30 ]; then echo "Docker daemon unavailable"; exit 1; fi
        sleep 1
      done
    - test -n "$CI_REGISTRY_IMAGE" || (echo "Enable GitLab Container Registry"; exit 1)
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker pull "$DEMO_IMAGE"
    - docker network create demo-ci
    - docker run -d --name checkout-demo --network demo-ci "$DEMO_IMAGE"
    # Run smoke tests from a second container over the same isolated network.
    - docker run --rm --network demo-ci --entrypoint python "$DEMO_IMAGE" /opt/app/scripts/smoke_test.py http://checkout-demo:8000
  after_script:
    - docker logs checkout-demo || true
    - docker rm -f checkout-demo || true
    - docker network rm demo-ci || true
